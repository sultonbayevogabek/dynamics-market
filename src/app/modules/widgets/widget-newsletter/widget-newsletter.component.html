<div class="widget-newsletter widget">
  <h4 class="widget-newsletter__title">
    {{ 'our.newsletter'| translate }}
  </h4>
  <div class="widget-newsletter__text">
    {{ 'subscribe.to.receive.helpful.news'| translate }}
  </div>
  <form class="widget-newsletter__form" action="">
    <label for="widget-newsletter-email" class="sr-only">{{ 'email'| translate }}</label>
    <input id="widget-newsletter-email" type="text" class="form-control" [placeholder]="'email'| translate">

    <button type="submit" class="btn btn-primary mt-3">{{ 'subscribe'| translate }}</button>
  </form>
</div>
