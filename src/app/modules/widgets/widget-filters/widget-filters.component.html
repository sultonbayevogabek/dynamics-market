<div class="widget-filters widget" [ngClass]="{
    'widget-filters--offcanvas--always': offcanvas === 'always',
    'widget-filters--offcanvas--mobile': offcanvas === 'mobile'
}" appCollapse>
  <h4 class="widget-filters__title widget__title">{{ 'filter'| translate }}</h4>

  <div class="widget-filters__list">
    <div class="widget-filters__item">
      <div class="filter filter--opened" appCollapseItem="filter--opened" #collapse="appCollapseItem">
        <button type="button" class="filter__title" (click)="collapse.toggle()">
          {{ 'categories'| translate }}
          <app-icon class="filter__arrow" name="arrow-rounded-down-12x7" size="12x7"></app-icon>
        </button>
        <div class="filter__body" appCollapseContent>
          <div class="filter__container">
            <div class="filter-categories filter-categories--root">
              <ul class="filter-categories__list">
                <li
                  class="filter-categories__item filter-categories__item--parent"
                  *ngIf="selectedCategory"
                >
                  <app-icon
                    class="filter-categories__arrow"
                    name="arrow-rounded-right-6x9"
                    size="6x9"
                  ></app-icon>
                  <a class="cursor-pointer" (click)="selectAllCategories()">{{ 'all.categories'| translate }}</a>
                </li>
                <ng-container *ngFor="let category of categories">
                  <ng-container
                    *ngTemplateOutlet="categoryItem; context: { $implicit: { category, categories } }"
                  >
                  </ng-container>
                </ng-container>
              </ul>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="widget-filters__actions d-flex">
    <button class="btn btn-secondary btn-sm" (click)="reset()">{{ 'reset.filter'| translate }}</button>
  </div>
</div>

<ng-template #categoryItem let-data>
  <li
    class="filter-categories__item"
    [ngClass]="{
      'filter-categories__item--parent': data?.category?.parent,
      'filter-categories__item--child': !data?.category?.parent,
      'filter-categories__item--current': data?.category?.slug === selectedCategory?.slug
    }"
    *ngIf="data?.category?.visible === undefined || data?.category?.visible"
  >
    <a class="cursor-pointer line-clamp-2" (click)="selectCategory(data?.category, data?.categories)">
      {{ data?.category?.name }}
    </a>

    <app-icon
      *ngIf="data?.category?.children?.length"
      class="filter-categories__arrow"
      [ngStyle]="{
        'transform': data?.category?.parent ? 'rotate(90deg)' : 'none'
      }"
      name="arrow-rounded-right-6x9"
      size="6x9"
    ></app-icon>
  </li>

  <ng-container *ngIf="data?.category?.showChildren">
    <ng-container *ngFor="let c of data?.category?.children">
      <ul class="filter-categories__list pl-3">
        <ng-container
          *ngTemplateOutlet="categoryItem; context: { $implicit: { category: c, categories: data?.category?.children } }"
        >
        </ng-container>
      </ul>
    </ng-container>
  </ng-container>
</ng-template>
