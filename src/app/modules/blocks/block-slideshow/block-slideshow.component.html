<!-- .block-slideshow -->
<div class="block-slideshow block"
     [ngClass]="{'block-slideshow--layout--full': !withDepartments, 'block-slideshow--layout--with-departments': withDepartments}">
  <div class="container">
    <div class="row">
      <div *ngIf="withDepartments" class="col-3 d-lg-block d-none" appDepartmentsArea></div>
      <div class="col-12" [ngClass]="{'col-lg-12': !withDepartments, 'col-lg-9': withDepartments}">
        <div class="block-slideshow__body">
          <owl-carousel-o *ngIf="banners?.length" [options]="options" appOwlPreventClick>
            <ng-template *ngFor="let banner of banners" carouselSlide>
              <a class="block-slideshow__slide" href="" appClick>
                <div class="block-slideshow__slide-image block-slideshow__slide-image--desktop"
                     [ngStyle]="{'background-image': 'url('+host + banner.images[0].path +')'}"></div>
                <div class="block-slideshow__slide-image block-slideshow__slide-image--mobile"
                     [ngStyle]="{'background-image': 'url('+host + banner.images[1].path +')'}"></div>
                <div class="block-slideshow__slide-content">
                  <div class="block-slideshow__slide-title"
                       [innerHTML]="sanitizer.bypassSecurityTrustHtml(banner.titleUz)"></div>
                  <div class="block-slideshow__slide-text"
                       [innerHTML]="sanitizer.bypassSecurityTrustHtml(banner.textUz)"></div>
                  <div class="block-slideshow__slide-button">
                    <span class="btn btn-primary btn-lg">Shop Now</span>
                  </div>
                </div>
              </a>
            </ng-template>
          </owl-carousel-o>

          <div *ngIf="!banners.length" class="w-full h-full bg-gray-200 animate-pulse"></div>
        </div>
      </div>
    </div>
  </div>
</div>
<!-- .block-slideshow / end -->
