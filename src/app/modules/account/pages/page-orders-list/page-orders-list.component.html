<div class="card">
  <div class="flex justify-center py-20" *ngIf="loading">
    <app-loader-spinner [size]="48"></app-loader-spinner>
  </div>

  <div class="block block-empty" *ngIf="!orders?.length && !loading">
    <div class="container">
      <div class="block-empty__body">
        <div class="block-empty__message">{{ 'your.shopping.cart.is.empty'| translate }}</div>
        <div class="block-empty__actions">
          <a [routerLink]="['/products']" class="btn btn-primary btn-sm">
            {{ 'continue'| translate }}
          </a>
        </div>
      </div>
    </div>
  </div>

  <ng-container *ngIf="orders?.length && !loading">
    <div class="card-header">
      <h5>{{ 'orders.history'| translate }}</h5>
    </div>
    <div class="card-divider"></div>
    <div class="card-table">
      <div class="table-responsive-sm">
        <table>
          <thead>
          <tr>
            <th>{{ 'order'| translate }}</th>
            <th>{{ 'date'| translate }}</th>
            <th>{{ 'status'| translate }}</th>
          </tr>
          </thead>
          <tbody>
          <tr *ngFor="let order of orders">
            <td><a [routerLink]="'/account/orders/' + order.orderCode">#{{ order.orderCode }}</a></td>
            <td>{{ order.createdAt| date: 'dd.MM.YYYY HH:mm' }}</td>
            <td>{{ order.status?.name }}</td>
          </tr>
          </tbody>
        </table>
      </div>
    </div>
    <div class="card-divider"></div>
    <div class="card-footer">
      <app-pagination
        [total]="params.pages"
        [current]="params.page"
        (pageChange)="getOrdersList($event)"
      ></app-pagination>
    </div>
  </ng-container>
</div>
